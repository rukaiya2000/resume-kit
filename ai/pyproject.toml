[project]
name = "resume-ai"
version = "0.3.0"
description = "MCP server that tailors resumes from Obsidian job notes (Phase 2 of resume-creator)"
requires-python = ">=3.14"
dependencies = [
    "mcp>=2.2",
    "httpx>=0.28",
    "python-frontmatter>=1.1",
    "pydantic>=2.11",
    "pypdf>=6.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"]  # en dashes in user-facing text are intentional

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
